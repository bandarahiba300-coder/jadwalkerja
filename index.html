<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal Kerja Tim - JAC Hiba Bandara</title>
<meta name="theme-color" content="#1e3a8a">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f0f4ff;margin:0;padding:6px}
.card{background:#fff;border-radius:14px;padding:10px;max-width:1200px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
h2{text-align:center;color:#1e3a8a;margin:0 0 2px;font-size:19px}
p.sub{text-align:center;color:#666;font-size:12px;margin:0 0 8px}
label{font-size:13px;font-weight:bold;display:block;margin-top:8px}
input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-top:5px;font-size:15px}
button{width:100%;padding:12px;border:none;border-radius:12px;background:#1e3a8a;color:#fff;font-weight:bold;font-size:14px;margin-top:12px;cursor:pointer}
.btn-yellow{background:#f59e0b;color:#111}.btn-gray{background:#6b7280}.btn-wa{background:#25D366}.btn-kunci{background:#dc2626}.btn-green{background:#16a34a}
.hint{font-size:11px;color:#888;margin-top:4px;text-align:center}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#1e3a8a;color:#fff;font-size:11px;font-weight:bold}
.nav-bulan{display:flex;gap:6px;align-items:center;margin-top:8px}
.nav-bulan button{width:44px;padding:10px 0;margin:0;font-size:18px}
.nav-bulan .tgl{flex:1;text-align:center;background:#f1f5f9;border-radius:10px;padding:10px;font-weight:bold;font-size:13px}
.status-online{text-align:center;font-size:11px;font-weight:bold;padding:6px;border-radius:20px;margin:0 0 8px;background:#dcfce7;color:#166534}
.status-offline{text-align:center;font-size:11px;font-weight:bold;padding:6px;border-radius:20px;margin:0 0 8px;background:#fee2e2;color:#991b1b}
.status-saving{text-align:center;font-size:11px;font-weight:bold;padding:6px;border-radius:20px;margin:0 0 8px;background:#fef3c7;color:#92400e}
.lock-box{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:10px;margin-top:10px;text-align:center}
.lock-box.ok{background:#f0fdf4;border-color:#bbf7d0}
.lock-box b{font-size:13px}
.lock-row{display:flex;gap:6px;margin-top:8px}
.lock-row input{flex:1;margin:0;text-align:center;letter-spacing:3px;font-weight:bold}
.lock-row button{width:110px;margin:0;padding:10px}
.legend{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:11px;font-weight:900}
.legend span{padding:5px 8px;border-radius:6px;border:1px solid #999}
.wrap-tabel{overflow-x:auto;margin-top:10px;border:1px solid #999;border-radius:6px;background:#fff}
table{border-collapse:collapse;font-size:13px;min-width:1250px}
th,td{border:1px solid #999;padding:0;text-align:center}
th{font-size:13px;padding:8px 2px;background:#d9d9d9}
th.minggu{background:#ffcccc}
td.nama{font-weight:bold;text-align:left;background:#fff;padding:8px 6px;min-width:150px;font-size:13px;position:sticky;left:0;z-index:3;white-space:nowrap;border-right:2px solid #333}
th.nama-sticky{position:sticky;left:0;z-index:4;min-width:150px;background:#d9d9d9;border-right:2px solid #333}
td.cell{width:48px;height:42px;min-width:48px;padding:0}
.cell-btn{width:100%;height:42px;border:none;font-size:13px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
.c-OFF{background:#ff0000;color:#fff}
.c-L{background:#ff0000;color:#fff}
.c-B1{background:#fbe4d5;color:#000}
.c-B2{background:#375623;color:#fff}
.c-F1{background:#ffc000;color:#000}
.c-F2{background:#00b050;color:#000}
.c-U1{background:#ffff00;color:#000}
.c-U2{background:#a9d08e;color:#000}
.c-S1{background:#ffd966;color:#000}
.c-S2{background:#548235;color:#fff}
.c-IZIN{background:#bdd7ee;color:#000}
.c-EMPTY{background:#fff;color:#999}
.total-box{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.total-box div{flex:1;min-width:90px;text-align:center;padding:9px;border-radius:10px;font-weight:bold;font-size:12px}
.t-s1{background:#dbeafe;color:#1e3a8a}.t-s2{background:#dcfce7;color:#166534}.t-libur{background:#fee2e2;color:#991b1b}.t-izin{background:#fef3c7;color:#92400e}.t-all{background:#1e3a8a;color:#fff}
.rekap-hari{margin-top:12px}
.rekap-hari h3{margin:6px 0;text-align:center;font-size:15px}
.hari-card{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-top:8px;background:#f8fafc}
.hari-card b{font-size:13px}
.hari-card div{font-size:12px;line-height:1.7;margin-top:4px}
.preview-box{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;white-space:pre-wrap;font-family:monospace;font-size:11px;line-height:1.5;max-height:300px;overflow-y:auto;margin-top:12px}
.btn-row{display:flex;gap:6px}.btn-row button{flex:1}
.modal{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:16px;padding-bottom:26px;box-shadow:0 -4px 20px rgba(0,0,0,.3);z-index:99;display:none;max-height:75vh;overflow-y:auto}
.modal.open{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;display:none}
.modal-bg.open{display:block}
.modal h3{margin:0 0 4px;text-align:center}
.modal p{margin:0 0 12px;text-align:center;font-size:12px;color:#666}
.grid-pilih{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid-pilih button{height:54px;font-size:14px;font-weight:900;border:2px solid #333;border-radius:10px;padding:0}
.grid-pilih button small{display:block;font-size:9px;font-weight:normal}

/* === INI YANG BARU - MODE LANDSCAPE FULL SAMPE BAWAH === */
@media (orientation: landscape) and (max-height: 500px){
  body{padding:0}
  .card{padding:4px 6px;border-radius:0;max-width:none}
  h2{font-size:15px}
  p.sub{display:none}
  .lock-box{padding:4px;margin-top:4px}
  .lock-box b{font-size:11px}
  .lock-row{margin-top:3px}
  .lock-row input{padding:5px}
  .lock-row button{padding:5px}
  label{margin-top:3px;font-size:11px}
  input[type="month"]{padding:4px;margin-top:2px}
  .nav-bulan{margin-top:3px}
  .nav-bulan button{padding:4px 0}
  .nav-bulan .tgl{padding:4px;font-size:11px}
  .legend{margin-top:3px}
  .legend span{padding:2px 5px;font-size:10px}
  .hint{display:none}
  .wrap-tabel{margin-top:4px;max-height:calc(100vh - 110px);overflow-y:auto}
  table{min-width:1100px}
  th{padding:2px 1px;font-size:11px}
  td.nama{padding:3px 5px;font-size:11px;min-width:130px}
  th.nama-sticky{min-width:130px}
  td.cell{width:42px;height:28px;min-width:42px}
  .cell-btn{height:28px;font-size:11px;border-radius:5px}
  .total-box{margin-top:4px}
  .total-box div{padding:4px;font-size:10px}
  .rekap-hari,.preview-box{display:none}
  .btn-row button, .btn-green, .btn-wa{padding:7px;margin-top:4px;font-size:12px}
}
</style>
</head>
<body>
<div class="card">
<div id="statusSync" class="status-offline">● MENGHUBUNGKAN...</div>
<h2>📅 Jadwal Kerja Tim - 1 Bulan</h2>
<p class="sub">JAC - Hiba Bandara &nbsp;<span class="badge">9 ORANG • FULL 1 BULAN</span></p>
<div class="lock-box" id="lockBox">
<b id="lockTitle">🔒 Jadwal Terkunci - Mode Lihat Saja</b>
<p class="hint" id="lockHint">Hanya yang punya PIN yang bisa edit jadwal</p>
<div class="lock-row" id="lockRow">
<input type="password" id="inputPin" placeholder="Masukkan PIN" inputmode="numeric">
<button onclick="bukaKunci()">🔓 Buka Edit</button>
